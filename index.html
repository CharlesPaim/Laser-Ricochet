<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Laser Ricochet: Blade Deflector</title>
    <script>
      // Poki SDK Compliance: Prevent scrolling on space and arrow keys
      window.addEventListener("keydown", function(ev) {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].indexOf(ev.code) !== -1 || ev.keyCode === 32) {
          ev.preventDefault();
        }
      }, { passive: false });
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Orbitron', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #080a14;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
      }
      .crt-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: linear-gradient(
          rgba(18, 16, 16, 0) 50%, 
          rgba(0, 0, 0, 0.22) 50%
        ), linear-gradient(
          90deg,
          rgba(255, 0, 0, 0.035),
          rgba(0, 255, 0, 0.015),
          rgba(0, 0, 255, 0.035)
        );
        background-size: 100% 3px, 3px 100%;
        z-index: 999;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="crt-screen" class="crt-overlay"></div>
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
